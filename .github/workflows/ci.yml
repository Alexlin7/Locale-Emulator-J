# ============================================================
# Locale Emulator - CI Workflow
# ============================================================
# .NET: dotnet build/test (self-contained SDK resolution)
# C++:  msbuild individual vcxproj (VS Build Tools)
# Core only has Release|Win32 config
# ============================================================

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # 手動觸發：可在 Actions 頁面或用 `gh workflow run CI --ref <branch>` 跑任一分支
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_DIR: ${{ github.workspace }}\

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK (x64)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # LEProc has PlatformTarget=x86 → dotnet test --arch x86 needs x86 SDK
      - name: Setup .NET 10 SDK (x86)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          architecture: x86

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # ---- .NET Build & Test ----

      - name: Restore .NET dependencies
        run: |
          dotnet restore tests/LECommonLibrary.Tests/LECommonLibrary.Tests.csproj
          dotnet restore tests/LEProc.Tests/LEProc.Tests.csproj
          dotnet restore tests/LEGUI.Tests/LEGUI.Tests.csproj

      - name: Build .NET projects (Debug)
        run: |
          dotnet build tests/LECommonLibrary.Tests/LECommonLibrary.Tests.csproj -c Debug --no-restore
          dotnet build tests/LEProc.Tests/LEProc.Tests.csproj -c Debug --no-restore
          dotnet build tests/LEGUI.Tests/LEGUI.Tests.csproj -c Debug --no-restore

      - name: Run .NET tests (x64)
        run: |
          dotnet test tests/LECommonLibrary.Tests/LECommonLibrary.Tests.csproj --no-build -c Debug --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory coverage
          dotnet test tests/LEGUI.Tests/LEGUI.Tests.csproj --no-build -c Debug --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Run LEProc.Tests (x86)
        run: dotnet test tests/LEProc.Tests/LEProc.Tests.csproj --arch x86 -c Debug --logger "console;verbosity=detailed" --collect:"XPlat Code Coverage" --results-directory coverage

      # ---- Code Coverage Report ----

      - name: Install ReportGenerator
        if: '!cancelled()'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        if: '!cancelled()'
        run: reportgenerator "-reports:coverage/*/coverage.cobertura.xml" "-targetdir:coveragereport" "-reporttypes:MarkdownSummaryGithub"
        shell: pwsh

      - name: Write Coverage to Job Summary
        if: '!cancelled()'
        run: Get-Content coveragereport/SummaryGithub.md | Add-Content $env:GITHUB_STEP_SUMMARY
        shell: pwsh

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          recreate: true
          path: coveragereport/SummaryGithub.md

      # ---- C++ Build ----
      # Pass SolutionDir so $(SolutionDir) resolves correctly in vcxproj OutDir

      - name: Build Core (Release|Win32)
        run: |
          msbuild src/Core/LoaderDll/LoaderDll.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild src/Core/LocaleEmulator/LocaleEmulator.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild src/Core/Loader/Loader.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      # x64 Core is under development and not shipped: its output is not copied
      # into Build/Release/. Hooks are disabled in the x64 build until the x64
      # HookEngine lands, but it must compile.
      - name: Build Core (Release|x64)
        run: |
          # Errors only: Core's legacy code produces many x64 truncation warnings.
          $failed = $false
          foreach ($proj in 'src/Core/LoaderDll/LoaderDll.vcxproj', 'src/Core/LocaleEmulator/LocaleEmulator.vcxproj') {
            msbuild $proj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$env:SOLUTION_DIR" /v:quiet "/clp:ErrorsOnly;NoSummary"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
        shell: pwsh

      - name: Build ShellExtension + C++ tests (Release|Win32)
        run: |
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tests/SmokeTest/LocaleTestApp/LocaleTestApp.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tests/Core.Tests/Core.Tests.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Build ShellExtension + tests (Release|x64)
        run: |
          msbuild src/ShellExtension/ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tests/ShellExtension.Tests/ShellExtension.Tests.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild tests/Core.Tests/Core.Tests.vcxproj /p:Configuration=Release /p:Platform=x64 "/p:SolutionDir=$env:SOLUTION_DIR" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      # ---- Assemble runtime directory ----
      # Build/Release/x86/ = complete product directory per README/CLAUDE.md:
      #   LEProc.exe, LEGUI.exe, LECommonLibrary.dll (.NET)
      #   LoaderDll.dll, LocaleEmulator.dll (Core native)
      #   ShellExtension.dll (C++, already here via vcxproj OutDir)
      #   LocaleTestApp.exe (C++ test app, already here via vcxproj OutDir)

      - name: Assemble runtime directory
        run: |
          dotnet publish src/LEProc/LEProc.csproj -c Release -o Build/Release/x86/
          dotnet publish src/LEGUI/LEGUI.csproj -c Release -o Build/Release/x86/
          Copy-Item src/Core/LoaderDll/Release/LoaderDll.dll Build/Release/x86/ -Force
          Copy-Item src/Core/LocaleEmulator/Release/LocaleEmulator.dll Build/Release/x86/ -Force
          Write-Host "Assembled files:" -ForegroundColor Cyan
          Get-ChildItem Build/Release/x86/ -Name | ForEach-Object { Write-Host "  $_" }
        shell: pwsh

      # ---- C++ Tests ----

      - name: Run C++ tests
        run: |
          $failed = $false
          # x86 tests
          $exes86 = Get-ChildItem -Path "Build\Release\x86" -Filter "*Tests*.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($exe in $exes86) {
            Write-Host "Running: $($exe.FullName)" -ForegroundColor Cyan
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $($exe.Name)" -ForegroundColor Red; $failed = $true }
          }
          # x64 tests
          $exes64 = Get-ChildItem -Path "Build\Release\x64" -Filter "*Tests*.exe" -Recurse -ErrorAction SilentlyContinue
          foreach ($exe in $exes64) {
            Write-Host "Running: $($exe.FullName)" -ForegroundColor Cyan
            & $exe.FullName
            if ($LASTEXITCODE -ne 0) { Write-Host "FAILED: $($exe.Name)" -ForegroundColor Red; $failed = $true }
          }
          if ($failed) { exit 1 }
        shell: pwsh

      # ---- Smoke Test ----

      - name: Smoke Tests
        run: .\tests\SmokeTest\Invoke-SmokeTest.ps1
        shell: pwsh
        if: success()

      # ---- Timing experiment (D7, design spec section 4.5) ----
      # Rebuilds x86 LocaleEmulator.dll with LE_EXPERIMENT_TIMING=1 (E1) / 2 (E2)
      # into a separate directory and runs the smoke test against a copy of the
      # runtime directory. Informational only: failures do not fail the build.

      - name: Timing experiment (E1, E2)
        # Runs even when the main smoke test fails, so E0 and E1/E2 can be compared.
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          $results = @()
          foreach ($e in 1, 2) {
            $int = "$env:SOLUTION_DIR" + "Build\Intermediate\Experiment\E$e\"
            $out = "$env:SOLUTION_DIR" + "Build\Experiment\E$e\bin\"
            msbuild src/Core/LocaleEmulator/LocaleEmulator.vcxproj /p:Configuration=Release /p:Platform=Win32 "/p:SolutionDir=$env:SOLUTION_DIR" "/p:IntDir=$int" "/p:OutDir=$out" /p:LeExperimentTiming=$e /v:minimal
            if ($LASTEXITCODE -ne 0) { $results += "E${e}: BUILD FAILED"; continue }
            $dir = "Build\Experiment\E$e\run"
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            Copy-Item Build\Release\x86 $dir -Recurse
            Copy-Item "$out\LocaleEmulator.dll" $dir -Force
            Write-Host "===== E$e smoke test =====" -ForegroundColor Cyan
            & .\tests\SmokeTest\Invoke-SmokeTest.ps1 -BuildDir (Resolve-Path $dir) -Verbose
            $results += "E${e}: smoke test exit code $LASTEXITCODE"
          }
          Write-Host "===== Timing experiment summary =====" -ForegroundColor Cyan
          $results | ForEach-Object { Write-Host $_ }
          $results | ForEach-Object { "- $_" } | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
        shell: pwsh

      # ---- Artifacts ----

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: build-output
          path: |
            Build/Release/x86/
            Build/Release/x64/
          retention-days: 7
